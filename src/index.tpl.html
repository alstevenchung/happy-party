  #tabs{flex-wrap:nowrap;overflow-x:auto;touch-action:pan-x}
  .tab{flex:0 0 62px}
  body.popen #joy{bottom:calc(46vh + 24px)}
  #hint{bottom:calc(46vh + 20px)}
  .seg button{padding:0 12px;font-size:15px}
  .rb{width:46px;height:46px;font-size:21px}
}

/* ===== 手機直向 / 窄螢幕 ===== */
@media (max-width:560px){
  .rb{width:42px;height:42px;font-size:19px}
  .seg button{height:38px;padding:0 10px;font-size:14px}
  #top{gap:5px}
  #acts button{height:48px;font-size:16px;padding:0 16px}
  #acts{gap:8px;max-width:94vw}
  .grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .sw{width:38px;height:38px}
  .card{width:146px;padding:12px 8px 10px}
  .card .ic{font-size:38px}
  .card b{font-size:16px}
  .card em{font-size:12px}
  .card span{font-size:11.5px;min-height:60px}
  .cards{gap:10px}
  #lvl h2{font-size:22px}
  .pbox{padding:14px 12px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  #hint{font-size:12.5px;padding:8px 13px}
  .tlogo{letter-spacing:4px}
  .pslot{width:150px}
  .pslot img{width:102px;height:102px}
  #toast{font-size:13.5px;max-width:94vw}
  #bubble{font-size:14px;max-width:210px}
}
/* ===== 手機橫向（矮螢幕） ===== */
@media (max-height:460px) and (orientation:landscape){
  .rb{width:38px;height:38px;font-size:16px}
  .seg button{height:34px;padding:0 10px;font-size:13px}
  #top{padding-top:calc(6px + env(safe-area-inset-top,0px));gap:5px}
  #panel{top:52px;bottom:8px;right:8px;width:min(47vw,360px)}
  .tab{flex:1 0 46px;font-size:11px;padding:3px 2px}
  .tab span{font-size:17px}
  #acts{bottom:10px}
  #acts button{height:42px;font-size:14px;padding:0 13px}
  #banner{font-size:min(5vw,26px);top:26%}
  #banner.ko{font-size:min(9vw,52px)}
  .card{width:138px;padding:10px 8px}
  .card .ic{font-size:33px}
  .card b{font-size:15px}
  .card span{font-size:11px;min-height:46px}
  .cards{gap:8px}
  #lvl{gap:10px}
  #lvl h2{font-size:19px;margin:0}
  .pbox{max-height:94vh;padding:12px 12px;gap:8px}
  .pbox h2{font-size:19px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px}
  .prow{padding:6px 9px}
  .pbtns button{height:42px;font-size:15px}
  #hint{font-size:11.5px;padding:7px 12px;bottom:8px}
  .tlogo{font-size:min(10vh,52px);letter-spacing:4px}
  .tsub{font-size:12px}
  #title{gap:10px}
  .pslot{width:132px;padding:8px 8px 10px;min-height:0}
  .pslot img{width:76px;height:76px}
  .pslot b{font-size:15px}
  .pnew{min-height:120px}
  .pnew span{font-size:36px}
  #toast{font-size:12px}
}
/* ===== 強制橫向提示 ===== */
#rotlock{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(160deg,#ffe3ec,#fff6d8 50%,#d8f3ff);text-align:center;padding:20px}
#rotlock.show{display:flex}
#rotlock .ph{font-size:76px;animation:rotp 1.8s ease-in-out infinite}
@keyframes rotp{0%,18%{transform:rotate(0)}55%,82%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
#rotlock b{font-size:22px;color:#5a4244}
#rotlock span{font-size:14px;color:#b0707f}

/* ================= 戰鬥 HUD v2 ================= */
body.fight .rb{width:44px;height:44px;font-size:20px}
body.fight #bPhoto{display:none!important}
body.fight #bNet,body.fight #bVoice{order:3}
body.fight #hint{display:none}
body.fight #toast{top:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:46vw}
@media (max-height:520px) and (orientation:landscape){.rb,body.fight .rb{width:40px;height:40px;font-size:17px}}
/* 左上：玩家卡 + 技能 + 狀態 */
#lhud{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:7px;align-items:flex-start;z-index:6;pointer-events:none;transform-origin:top left;transform:scale(var(--uis,1))}
body.fight #lhud{display:flex}
#hud{display:flex;align-items:center;gap:10px;background:rgba(255,252,246,.92);border:3px solid #fff;border-radius:40px 24px 24px 40px;padding:5px 14px 5px 5px;box-shadow:0 4px 0 rgba(90,60,70,.16),0 8px 18px rgba(90,60,70,.14)}
.pav{position:relative;width:62px;height:62px;flex:0 0 auto}
#meAva{width:62px;height:62px;border-radius:50%;background:#ffe9d6;border:3px solid #f7a8c0;display:block}
#xplv{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:linear-gradient(#ffb04a,#ff8a2a);color:#fff;font-size:12px;font-weight:900;padding:0 8px;border-radius:10px;border:2px solid #fff;white-space:nowrap;line-height:1.45}
.pbars{display:flex;flex-direction:column;gap:5px;width:236px}
.bar{position:relative;height:22px;border-radius:11px;background:#4b3b46;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.bar i,.bar u{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:11px}
.bar i{transition:width .12s}
.bar u{background:#fff3c4;opacity:.85;transition:width .55s .18s ease-out}
.bar.hp i{background:linear-gradient(#93ea9d,#4cc468)}
.bar.hp i.mid{background:linear-gradient(#ffd77a,#f5a83a)}
.bar.hp i.lo{background:linear-gradient(#ff8f95,#e8505b);animation:hplow .5s infinite alternate}
@keyframes hplow{to{filter:brightness(1.25)}}
.bar.hp i::after,.bar.gg i::after{content:'';position:absolute;left:5px;right:5px;top:2px;height:32%;border-radius:4px;background:rgba(255,255,255,.38)}
.bar.hp::before{content:'♥';position:absolute;left:8px;top:0;line-height:22px;font-size:13px;color:#fff;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#hpt{position:absolute;right:10px;top:0;line-height:22px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65);z-index:2}
.bar.gg{height:12px}
.bar.gg i{background:linear-gradient(#a9e2ff,#58aef0)}
.bar.gg.full i{background:linear-gradient(#fff1a8,#ffc234);animation:hplow .4s infinite alternate}
.bar.xp{height:6px;background:rgba(75,59,70,.55)}
.bar.xp i{background:linear-gradient(90deg,#ffd24a,#ff9a3c);width:0}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(159,216,255,0)}to{box-shadow:0 0 16px 5px #9fd8ff}}
#skills{display:flex;flex-wrap:wrap;gap:4px;max-width:330px}
.sk{background:rgba(255,252,246,.92);border:2px solid #fff;border-radius:11px;padding:0 6px 0 4px;font-size:17px;line-height:1.5;display:flex;align-items:center;gap:2px;box-shadow:0 2px 0 rgba(90,60,70,.18)}
.sk small{font-size:12px;font-weight:900;color:#e8505b}
.sk.mx{background:linear-gradient(#fff6c8,#ffe08a);border-color:#ffc234}
.sk.mx small{color:#b26a00}
#buffs{display:flex;gap:6px;flex-wrap:wrap}
#elembuff,#starbuff{display:none;background:rgba(255,252,246,.94);border:3px solid #fff;border-radius:16px;padding:1px 11px;font-size:16px;font-weight:900;box-shadow:0 3px 0 rgba(90,60,70,.18);white-space:nowrap}
#starbuff{background:linear-gradient(90deg,#ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff);animation:starblink .4s infinite alternate}
/* 置中：波數條 + 魔王血條 + 連擊 */
#chud{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%) scale(var(--uis,1));transform-origin:top center;display:none;flex-direction:column;align-items:center;gap:7px;z-index:6;pointer-events:none}
body.fight #chud{display:flex}
#hinfo{display:flex;align-items:center;background:rgba(62,46,58,.74);color:#fff;border-radius:20px;padding:4px 4px;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.9);white-space:nowrap;box-shadow:0 3px 0 rgba(60,30,40,.18)}
#hinfo span{padding:0 12px;border-right:1px solid rgba(255,255,255,.28)}
#hinfo span:last-child{border-right:0}
#hinfo b{color:#ffd86a;font-size:16px}
#bossbar{display:none;width:clamp(200px,calc((100vw - 720px*var(--uis,1))/var(--uis,1)),420px);text-align:center}
#bossbar.show{display:block}
#bbname{font-weight:900;font-size:13px;color:#fff;text-shadow:0 0 4px rgba(90,26,48,.95),0 2px 0 rgba(0,0,0,.4);margin-bottom:3px;letter-spacing:1px}
.bbb{position:relative;height:16px;border-radius:9px;background:#3a2836;box-shadow:0 0 0 3px #fff,0 4px 0 3px rgba(60,30,40,.2);overflow:hidden}
.bbb i,.bbb u{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px}
.bbb i{background:linear-gradient(#ff7a8c,#e8334f);transition:width .15s}
.bbb u{background:#ffe9a8;transition:width .6s .2s ease-out}
.bbb i::after{content:'';position:absolute;left:5px;right:5px;top:2px;height:32%;border-radius:4px;background:rgba(255,255,255,.35)}
#hcombo{height:36px;text-align:center;font-size:30px;font-weight:900;color:#ff8a3c;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 3px 0 rgba(60,30,40,.25);opacity:0}
#hcombo.show{opacity:1;animation:cpop .15s}
@keyframes cpop{from{transform:scale(1.5)}to{transform:scale(1)}}
#killc{display:none!important}
/* 右上：小地圖 + 夥伴卡 */
#mmap{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:236px;height:63px;display:none;z-index:6;pointer-events:none;transform-origin:top right;transform:scale(var(--uis,1));opacity:.92}
body.fight #mmap{display:block}
@media (max-height:520px) and (orientation:landscape){#mmap{top:calc(54px + env(safe-area-inset-top,0px))}}
#coHud{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));display:none;flex-direction:column;align-items:flex-end;gap:6px;z-index:6;pointer-events:none;transform-origin:top right;transform:scale(var(--uis,1))}
body.fight #coHud{top:calc(64px + 72px*var(--uis,1) + env(safe-area-inset-top,0px))}
.cocard{display:flex;flex-direction:row;align-items:center;gap:8px;background:rgba(255,252,246,.92);border:3px solid #fff;border-radius:30px 18px 18px 30px;padding:3px 12px 3px 3px;box-shadow:0 4px 0 rgba(90,60,70,.16)}
.coava{width:40px;height:40px;border-radius:50%;border:3px solid #8fc8f2;background:#fff;flex:0 0 auto}
.coinfo{display:flex;flex-direction:column;gap:2px;min-width:92px}
.coinfo>div:first-child{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.coname{font-size:13px;font-weight:900;color:#5a4244;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cohp{width:100%;height:9px;border-radius:5px;background:#4b3b46;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.cohp i{display:block;height:100%;width:100%;background:#6bd47a;border-radius:5px;transition:width .2s}
.coping{font-size:11px;font-weight:800;color:#5a4244;white-space:nowrap}
#hostwarn{display:none;background:#fff3d6;border:3px solid #ffb84a;color:#8a4b00;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:900;box-shadow:0 3px 0 rgba(90,60,70,.16);max-width:260px;text-align:center;line-height:1.35}
#banner.join{-webkit-text-stroke:2px #3f9cf0;color:#fff;top:20%}
#netbadge{position:fixed;top:calc(12px + 50px*var(--uis,1));left:50%;transform:translateX(-50%);z-index:7;background:#fff8ec;border:3px solid #ffd24a;border-radius:999px;padding:6px 16px;font-size:15px;font-weight:900;color:#5a4244;box-shadow:0 3px 0 rgba(0,0,0,.14);cursor:pointer;animation:nbPulse 1.1s infinite alternate;white-space:nowrap}
/* 右下：出拳 / 蓋亞炮 */
#fbtns{position:fixed;left:auto!important;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:none;gap:10px;align-items:flex-end;z-index:6;transform-origin:bottom right;transform:scale(var(--uib,1))}
body.fight #fbtns{display:flex}
#fbtns button{position:relative;isolation:isolate;border:0;border-radius:50%;padding:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;color:#fff;transition:transform .06s}
#fbtns button::before{content:'';position:absolute;inset:0;border-radius:50%;z-index:-2;background:#fff;box-shadow:0 7px 0 rgba(60,30,40,.24),0 12px 22px rgba(60,30,40,.22)}
#fbtns button::after{content:'';position:absolute;inset:6px;border-radius:50%;z-index:-1}
#fbtns button:active{transform:translateY(5px) scale(.97)}
#fbtns small{font-size:13px;font-weight:900;margin-top:-4px;text-shadow:0 1px 0 rgba(0,0,0,.28);letter-spacing:1px}
#bPunch{width:128px;height:128px;font-size:52px}
#bPunch::after{background:radial-gradient(circle at 34% 26%,#ffa3ab,#ee5a66 52%,#d23c50)}
#bPunch.tc::before{background:conic-gradient(#ffc234 calc(var(--p,0)*1%),#fff 0)}
#bCharge{width:92px;height:92px;font-size:34px;margin-bottom:56px;margin-right:-6px}
#bCharge::before{background:conic-gradient(#ffc234 calc(var(--g,0)*1%),#fff 0)}
#bCharge::after{inset:7px;background:radial-gradient(circle at 34% 26%,#b9dcf2,#7fa9c8 55%,#6a8fae)}
#bCharge.full::after{background:radial-gradient(circle at 34% 26%,#aee0ff,#3f9cf0 52%,#2a78d8)}
#bCharge.full{animation:ready .55s infinite alternate}
@keyframes ready{from{filter:drop-shadow(0 0 0 rgba(255,210,74,0))}to{filter:drop-shadow(0 0 12px rgba(255,200,60,.95))}}
/* 左下：搖桿 */
#joy{position:fixed;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0,rgba(255,255,255,.36) 72%);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(60,30,40,.16),inset 0 0 0 10px rgba(255,255,255,.1);touch-action:none;z-index:3;transition:opacity .2s;transform-origin:bottom left;transform:scale(var(--uib,1))}
#joy.float{opacity:.96;transition:none}
#knob{position:absolute;left:36px;top:36px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffc6d8,#f48fb1 58%,#e56f99);border:3px solid #fff;box-shadow:0 4px 0 rgba(60,30,40,.2);pointer-events:none}
body[data-mode=create] #joy{display:none}
@media (max-height:460px) and (orientation:landscape){
  #acts{left:56%;max-width:62vw}
  #joy{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #fbtns{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
</style>
